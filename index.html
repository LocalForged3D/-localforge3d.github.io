<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"
>

<meta name="theme-color" content="#090d13">
<meta name="color-scheme" content="dark">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LocalForge 3D">

<meta
  name="description"
  content="LocalForge 3D browser-based modeling and sculpting workspace."
>

<title>LocalForge 3D</title>

<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./app.css">

<!--
  Minimal emergency shell styling.

  app.css remains the real application stylesheet.
  This only prevents an unusable unstyled page if CSS is delayed.
-->
<style>
html,
body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: #090d13;
  color: #f5f7fb;
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;
}

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  min-height: 100dvh;
  overflow-x: hidden;
  overscroll-behavior: none;

  padding-top: env(safe-area-inset-top);
  padding-right: env(safe-area-inset-right);
  padding-bottom: env(safe-area-inset-bottom);
  padding-left: env(safe-area-inset-left);
}

button,
input,
select {
  font: inherit;
}

button {
  touch-action: manipulation;
}

#forge3d {
  width: 100%;
  min-height: 100dvh;
}

.f-app {
  width: 100%;
  min-height: 100dvh;
}

.f-view {
  position: relative;
  width: 100%;
  min-height: 420px;
  overflow: hidden;
  background:
    radial-gradient(
      circle at 50% 35%,
      #172332 0%,
      #0d141d 45%,
      #080c12 100%
    );
  touch-action: none;
}

.f-view canvas {
  position: absolute;
  inset: 0;
  display: block;
  width: 100% !important;
  height: 100% !important;
}

/* Temporary viewport shown before Three.js creates its canvas */

#f-shell-scene {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  transition:
    opacity .2s ease,
    visibility .2s ease;
}

.forge-ready #f-shell-scene {
  opacity: 0;
  visibility: hidden;
}

/* Grid fallback */

.f-shell-grid {
  position: absolute;
  left: -25%;
  right: -25%;
  bottom: -28%;
  height: 70%;

  background-image:
    linear-gradient(
      rgba(85, 116, 148, .19) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(85, 116, 148, .19) 1px,
      transparent 1px
    );

  background-size: 44px 44px;

  transform:
    perspective(450px)
    rotateX(62deg);

  transform-origin: center bottom;
}

/* Visible cube immediately while JS starts */

.f-shell-cube {
  position: absolute;
  left: 50%;
  top: 43%;

  width: 112px;
  height: 112px;

  transform:
    translate(-50%, -50%)
    rotate(45deg);

  border: 2px solid #2998ff;

  background:
    linear-gradient(
      135deg,
      rgba(41,152,255,.22),
      rgba(41,152,255,.04)
    );

  box-shadow:
    0 0 35px rgba(41,152,255,.12),
    inset 0 0 28px rgba(41,152,255,.08);
}

/* Startup message */

#f-shell-message {
  position: absolute;
  left: 50%;
  top: 63%;

  transform: translate(-50%, -50%);

  text-align: center;
  white-space: nowrap;

  color: #dfe8f2;

  font-size: 13px;
  font-weight: 700;

  letter-spacing: .02em;

  pointer-events: none;
}

#f-shell-message::before {
  content: "";

  display: block;

  width: 24px;
  height: 24px;

  margin: 0 auto 12px;

  border-radius: 50%;

  border: 3px solid rgba(41,152,255,.18);
  border-top-color: #2998ff;

  animation: forge-spin .7s linear infinite;
}

@keyframes forge-spin {
  to {
    transform: rotate(360deg);
  }
}

/* Mobile viewport */

@media (max-width: 720px) {
  .f-view {
    min-height: 430px;
    height: 52dvh;
  }

  .f-shell-cube {
    width: 94px;
    height: 94px;
  }
}
</style>

</head>

<body>

<main
  id="forge3d"
  class="forge3d"
  data-forge-state="loading"
>

<div class="f-app">

  <!-- ======================================================
       APPLICATION HEADER
       ====================================================== -->

  <header class="f-header">

    <div class="f-brand">

      <div class="f-logo" aria-hidden="true">
        LF
      </div>

      <div class="f-brand-copy">
        <strong>LocalForge 3D</strong>
        <span>Browser Modeling Workspace</span>
      </div>

    </div>

    <div class="f-engine">

      <span
        id="f-engine-dot"
        class="f-engine-dot"
        data-state="loading"
      ></span>

      <span id="f-engine-state">
        Starting
      </span>

    </div>

  </header>


  <!-- ======================================================
       WORKSPACE MODES
       ====================================================== -->

  <nav
    class="f-bar f-workspaces"
    aria-label="Workspace modes"
  >

    <button
      class="f-tab active"
      type="button"
      data-work="object"
    >
      Object
    </button>

    <button
      class="f-tab"
      type="button"
      data-work="edit"
    >
      Edit
    </button>

    <button
      class="f-tab"
      type="button"
      data-work="sculpt"
    >
      Sculpt
    </button>

    <button
      class="f-tab"
      type="button"
      data-work="nodes"
    >
      Nodes
    </button>

  </nav>


  <!-- ======================================================
       MAIN EDITOR
       ====================================================== -->

  <div class="f-layout">


    <!-- LEFT TOOL PANEL -->

    <aside class="f-panel f-left">

      <div class="f-head">

        <span id="f-left-title">
          Object Tools
        </span>

      </div>

      <div
        class="f-body"
        id="f-left"
      >

        <!--
          Temporary usable controls.
          app.js can replace this content after initialization.
        -->

        <div class="f-label">
          Primitive
        </div>

        <div class="f-tools">

          <button
            class="f-tool"
            type="button"
            data-tool="Box"
          >
            Box
          </button>

          <button
            class="f-tool"
            type="button"
            data-tool="Sphere"
          >
            Sphere
          </button>

          <button
            class="f-tool"
            type="button"
            data-tool="Cylinder"
          >
            Cylinder
          </button>

          <button
            class="f-tool"
            type="button"
            data-tool="Torus"
          >
            Torus
          </button>

        </div>

      </div>

    </aside>


    <!-- ====================================================
         3D VIEWPORT
         ==================================================== -->

    <section class="f-stage">

      <!-- VIEWPORT TOOLBAR -->

      <div class="f-stagebar">

        <button
          class="f-btn active"
          type="button"
          data-gizmo="translate"
        >
          Move
        </button>

        <button
          class="f-btn"
          type="button"
          data-gizmo="rotate"
        >
          Rotate
        </button>

        <button
          class="f-btn"
          type="button"
          data-gizmo="scale"
        >
          Scale
        </button>

        <button
          class="f-btn"
          type="button"
          id="f-space"
        >
          World
        </button>

        <div class="f-spacer"></div>

        <button
          class="f-btn"
          type="button"
          id="f-undo"
          disabled
        >
          Undo
        </button>

        <button
          class="f-btn"
          type="button"
          id="f-redo"
          disabled
        >
          Redo
        </button>

        <button
          class="f-btn"
          type="button"
          id="f-frame"
        >
          Frame
        </button>

        <button
          class="f-btn"
          type="button"
          id="f-wire"
        >
          Wire
        </button>

      </div>


      <!-- ACTUAL THREE.JS VIEW -->

      <div
        class="f-view"
        id="f-view"
        aria-label="LocalForge 3D viewport"
      >

        <!--
          Instant visual placeholder.

          bootstrap.js removes this after app.js creates
          the real Three.js canvas.
        -->

        <div id="f-shell-scene">

          <div class="f-shell-grid"></div>

          <div class="f-shell-cube"></div>

          <div id="f-shell-message">
            Opening LocalForge workspace…
          </div>

        </div>


        <div
          class="f-overlay"
          id="f-overlay"
        >
          One finger: orbit · Two fingers: zoom/pan
        </div>

      </div>


      <!-- ENGINE STATUS -->

      <div
        class="f-status"
        id="f-status"
        role="status"
        aria-live="polite"
      >
        Starting LocalForge…
      </div>

    </section>


    <!-- ====================================================
         RIGHT PROPERTIES PANEL
         ==================================================== -->

    <aside class="f-panel f-right">

      <div class="f-head">

        <span id="f-right-title">
          Properties
        </span>

      </div>

      <div
        class="f-body"
        id="f-right"
      >

        <!-- Initial transform controls -->

        <div class="f-label">
          Transform
        </div>


        <div class="f-label">
          Position
        </div>

        <div class="f-grid3">

          <div class="f-field">
            <label>X</label>
            <input
              type="number"
              value="0"
              step="0.1"
              disabled
            >
          </div>

          <div class="f-field">
            <label>Y</label>
            <input
              type="number"
              value="1"
              step="0.1"
              disabled
            >
          </div>

          <div class="f-field">
            <label>Z</label>
            <input
              type="number"
              value="0"
              step="0.1"
              disabled
            >
          </div>

        </div>


        <div class="f-label">
          Rotation
        </div>

        <div class="f-grid3">

          <div class="f-field">
            <label>X</label>
            <input
              type="number"
              value="0"
              disabled
            >
          </div>

          <div class="f-field">
            <label>Y</label>
            <input
              type="number"
              value="0"
              disabled
            >
          </div>

          <div class="f-field">
            <label>Z</label>
            <input
              type="number"
              value="0"
              disabled
            >
          </div>

        </div>


        <div class="f-label">
          Scale
        </div>

        <div class="f-grid3">

          <div class="f-field">
            <label>X</label>
            <input
              type="number"
              value="1"
              disabled
            >
          </div>

          <div class="f-field">
            <label>Y</label>
            <input
              type="number"
              value="1"
              disabled
            >
          </div>

          <div class="f-field">
            <label>Z</label>
            <input
              type="number"
              value="1"
              disabled
            >
          </div>

        </div>

      </div>

    </aside>

  </div>

</div>

</main>


<!-- ========================================================
     STARTUP

     IMPORTANT:
     bootstrap.js is the ONLY application entry point.

     It loads:
       runtime.js
       database.js
       autosave.js
       app.js
       build.json

     and registers sw.js after startup.
     ======================================================== -->

<script type="module" src="./bootstrap.js"></script>

</body>
</html>
