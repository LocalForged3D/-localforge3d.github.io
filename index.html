<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"
>

<meta name="theme-color" content="#080a0e">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LocalForge 3D">

<title>LocalForge 3D</title>

<link rel="manifest" href="./manifest.webmanifest">

<!-- Existing stylesheet is still allowed to extend/override this -->
<link rel="stylesheet" href="./assets/css/app.css">

<!-- Three.js import map -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/"
  }
}
</script>

<style>
:root{
  --bg:#080a0e;
  --panel:#11141a;
  --panel2:#171b22;
  --panel3:#20252e;
  --border:#2c323d;
  --border2:#3a424f;
  --text:#f3f5f7;
  --muted:#8993a2;
  --blue:#0a84ff;
  --green:#30d158;
  --orange:#ff9f0a;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;
  overscroll-behavior:none;
}

body{
  min-height:100vh;
  min-height:100dvh;
}

button,input,select{
  font:inherit;
}

button{
  color:inherit;
}

#forge3d{
  width:100%;
  min-height:100vh;
  min-height:100dvh;

  padding:
    calc(env(safe-area-inset-top) + 6px)
    6px
    calc(env(safe-area-inset-bottom) + 6px);

  background:
    radial-gradient(
      circle at 50% -20%,
      #172130,
      #0c1016 38%,
      #080a0e 75%
    );
}

.f-app{
  width:100%;
  max-width:1500px;
  margin:auto;
}

/* HEADER */

.lf-header{
  height:48px;
  display:flex;
  align-items:center;
  gap:9px;

  margin-bottom:6px;
  padding:0 10px;

  border:1px solid var(--border);
  border-radius:13px;

  background:#12151b;
}

.lf-logo{
  width:30px;
  height:30px;
  flex:0 0 30px;

  display:grid;
  place-items:center;

  border-radius:8px;

  background:linear-gradient(145deg,#299cff,#006ee6);

  font-size:12px;
  font-weight:900;
}

.lf-brand{
  min-width:0;
}

.lf-name{
  font-size:13px;
  font-weight:850;
}

.lf-sub{
  margin-top:1px;
  color:var(--muted);
  font-size:9px;
}

.lf-engine{
  margin-left:auto;

  display:flex;
  align-items:center;
  gap:6px;

  padding:6px 9px;

  border:1px solid var(--border);
  border-radius:20px;

  background:#191d24;

  color:#a8b0bc;

  font-size:9px;
  font-weight:750;
}

.lf-dot{
  width:7px;
  height:7px;

  border-radius:50%;

  background:var(--orange);

  box-shadow:0 0 8px var(--orange);

  animation:pulse 1.2s infinite;
}

body.engine-ready .lf-dot{
  background:var(--green);
  box-shadow:0 0 8px var(--green);
  animation:none;
}

@keyframes pulse{
  0%,100%{opacity:.35}
  50%{opacity:1}
}

/* TOP BAR */

.f-bar,
.f-stagebar{
  display:flex;
  align-items:center;
  gap:5px;

  border:1px solid var(--border);

  background:#12151b;
}

.f-bar{
  min-height:48px;

  margin-bottom:6px;
  padding:5px;

  border-radius:13px;
}

.f-stagebar{
  min-height:47px;

  padding:5px;

  border-width:0 0 1px 0;
}

.f-spacer{
  flex:1;
}

.f-btn,
.f-tab,
.f-tool{
  min-height:38px;

  border:1px solid var(--border);

  border-radius:9px;

  padding:0 10px;

  background:#1b2028;

  color:#b6bfcb;

  font-size:11px;
  font-weight:750;

  cursor:pointer;
}

.f-btn.active,
.f-tab.active,
.f-tool.active,
.f-primary{
  background:linear-gradient(#168eff,#0875e5);
  border-color:#2b96ff;
  color:white;
}

.f-btn:disabled,
.f-tool:disabled{
  opacity:.38;
}

/* EDITOR */

.f-layout{
  display:grid;
  grid-template-columns:230px minmax(0,1fr) 275px;

  gap:6px;
}

.f-panel,
.f-stage{
  border:1px solid var(--border);
  border-radius:13px;

  overflow:hidden;

  background:var(--panel);
}

.f-panel{
  min-height:560px;
}

.f-stage{
  min-width:0;

  display:flex;
  flex-direction:column;
}

.f-head{
  min-height:43px;

  display:flex;
  align-items:center;

  padding:0 11px;

  border-bottom:1px solid var(--border);

  background:#151920;

  color:#cbd2dc;

  font-size:10px;
  font-weight:850;

  text-transform:uppercase;
  letter-spacing:.06em;
}

.f-body{
  padding:9px;
}

/* VIEWPORT */

.f-view{
  position:relative;

  flex:1;

  width:100%;
  min-height:520px;

  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 38%,
      #202630,
      #12161d 48%,
      #090c10 100%
    );

  touch-action:none;
}

.f-view canvas{
  position:absolute;
  inset:0;

  display:block;

  width:100%!important;
  height:100%!important;

  z-index:3;

  touch-action:none;
}

/* FALLBACK VIEWPORT */

.lf-fallback{
  position:absolute;
  inset:0;

  z-index:1;

  overflow:hidden;

  transition:opacity .3s ease;
}

.f-view.has-canvas .lf-fallback{
  opacity:0;
  pointer-events:none;
}

.lf-grid{
  position:absolute;

  width:160%;
  height:100%;

  left:-30%;
  top:44%;

  background-image:
    linear-gradient(
      rgba(100,130,160,.24) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(100,130,160,.24) 1px,
      transparent 1px
    );

  background-size:36px 36px;

  transform:
    perspective(500px)
    rotateX(63deg);

  transform-origin:center top;
}

.lf-cube{
  position:absolute;

  left:50%;
  top:42%;

  width:90px;
  height:90px;

  transform:
    translate(-50%,-50%)
    rotate(45deg);

  border:1px solid #399cff;

  background:rgba(10,132,255,.12);

  box-shadow:
    inset 0 0 25px rgba(10,132,255,.15),
    0 20px 50px rgba(0,0,0,.35);

  animation:cubeFloat 3s ease-in-out infinite;
}

@keyframes cubeFloat{
  0%,100%{
    transform:
      translate(-50%,-50%)
      rotate(45deg);
  }

  50%{
    transform:
      translate(-50%,-56%)
      rotate(52deg);
  }
}

.lf-loading{
  position:absolute;

  left:50%;
  top:65%;

  transform:translate(-50%,-50%);

  width:240px;

  text-align:center;
}

.lf-spinner{
  width:27px;
  height:27px;

  margin:0 auto 10px;

  border:2px solid rgba(255,255,255,.12);
  border-top-color:#299cff;

  border-radius:50%;

  animation:spin .7s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.lf-load-title{
  color:#dce3ec;

  font-size:12px;
  font-weight:800;
}

.lf-load-sub{
  margin-top:4px;

  color:#7f8998;

  font-size:9px;
}

/* OVERLAY */

.f-overlay{
  position:absolute;

  z-index:6;

  left:8px;
  bottom:8px;

  max-width:calc(100% - 16px);

  padding:6px 8px;

  border:1px solid rgba(255,255,255,.08);
  border-radius:8px;

  background:rgba(4,6,9,.72);

  color:#aab3c0;

  font-size:9px;

  pointer-events:none;
}

.f-status{
  min-height:33px;

  display:flex;
  align-items:center;

  padding:0 10px;

  border-top:1px solid var(--border);

  background:#101319;

  color:#8993a2;

  font-size:9px;
}

/* DYNAMIC UI */

.f-label{
  margin:7px 0 6px;

  color:#7f8998;

  font-size:9px;
  font-weight:850;

  text-transform:uppercase;
  letter-spacing:.07em;
}

.f-divider{
  height:1px;

  margin:10px 0;

  background:var(--border);
}

.f-tools{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:5px;
}

.f-tool{
  padding:0 6px;
}

.f-field{
  margin-bottom:7px;
}

.f-field label{
  display:block;

  margin-bottom:4px;

  color:#9da7b4;

  font-size:9px;
  font-weight:700;
}

.f-field input,
.f-field select{
  width:100%;

  min-height:38px;

  padding:5px 7px;

  border:1px solid var(--border2);

  border-radius:8px;

  background:#1a1f27;

  color:white;

  outline:none;
}

.f-field input:focus,
.f-field select:focus{
  border-color:var(--blue);
}

.f-grid2{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:5px;
}

.f-grid3{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:5px;
}

.f-range-row{
  display:grid;

  grid-template-columns:1fr 64px;

  gap:5px;

  align-items:center;
}

.f-range-row input[type=range]{
  padding:0;
}

.f-help,
.f-msg{
  color:#8993a2;

  font-size:9px;

  line-height:1.5;
}

.f-checks{
  display:flex;
  flex-wrap:wrap;

  gap:5px;
}

.f-check{
  display:flex;
  align-items:center;

  gap:5px;

  min-height:35px;

  padding:0 7px;

  border:1px solid var(--border);

  border-radius:8px;

  color:#aab3bf;

  font-size:9px;
}

.f-node-list{
  display:flex;
  flex-direction:column;

  gap:5px;
}

.f-node{
  padding:8px;

  border:1px solid var(--border);

  border-radius:8px;

  background:#191e25;
}

.f-node.selected{
  border-color:var(--blue);

  background:#13243a;
}

.f-node.off{
  opacity:.45;
}

.f-node-title{
  display:flex;
  align-items:center;

  gap:6px;

  font-size:10px;
  font-weight:800;
}

.f-node-sub{
  margin-top:3px;

  color:#7e8896;

  font-size:8px;
}

.f-dot{
  width:8px;
  height:8px;

  border-radius:50%;

  background:#ff9f0a;
}

.f-node.source .f-dot{
  background:#30d158;
}

.f-node.transform .f-dot{
  background:#0a84ff;
}

.f-node.material .f-dot{
  background:#bf5af2;
}

.f-node.output .f-dot{
  background:#8e8e93;
}

.f-node-actions{
  display:flex;
  flex-wrap:wrap;

  gap:4px;

  margin-top:6px;
}

.f-mini{
  min-height:28px;

  border:1px solid var(--border);

  border-radius:6px;

  background:#202630;

  color:#b4bdc8;

  font-size:8px;
}

.f-presets{
  display:flex;
  flex-wrap:wrap;

  gap:5px;
}

.f-chip{
  min-height:31px;

  padding:0 9px;

  border:1px solid var(--border);

  border-radius:16px;

  background:#202630;

  color:#b4bdc8;

  font-size:9px;
}

.f-color{
  height:40px;
  padding:3px!important;
}

/* TABLET */

@media(max-width:1050px){

  .f-layout{
    grid-template-columns:
      205px minmax(0,1fr);
  }

  .f-right{
    grid-column:1/-1;

    min-height:0;
  }

}

/* MOBILE */

@media(max-width:720px){

  #forge3d{
    padding:
      calc(env(safe-area-inset-top) + 4px)
      4px
      calc(env(safe-area-inset-bottom) + 4px);
  }

  .lf-header{
    height:44px;

    margin-bottom:4px;

    border-radius:11px;
  }

  .lf-logo{
    width:27px;
    height:27px;

    flex-basis:27px;

    font-size:10px;
  }

  .lf-name{
    font-size:12px;
  }

  .lf-sub{
    display:none;
  }

  .lf-engine{
    padding:5px 7px;

    font-size:8px;
  }

  .f-bar{
    position:sticky;

    top:calc(env(safe-area-inset-top) + 3px);

    z-index:30;

    min-height:45px;

    margin-bottom:4px;

    padding:4px;

    gap:3px;

    border-radius:11px;
  }

  .f-tab{
    flex:1 1 0;

    min-width:0;

    min-height:36px;

    padding:0 3px;

    font-size:10px;
  }

  .f-bar .f-spacer{
    display:none;
  }

  #f-undo,
  #f-redo,
  #f-frame,
  #f-wire{
    display:none;
  }

  .f-layout{
    display:flex;

    flex-direction:column;

    gap:4px;
  }

  .f-stage{
    order:1;

    border-radius:11px;
  }

  .f-left{
    order:2;

    min-height:0;

    border-radius:11px;
  }

  .f-right{
    order:3;

    min-height:0;

    border-radius:11px;
  }

  .f-stagebar{
    min-height:43px;

    padding:4px;

    gap:3px;
  }

  .f-stagebar .f-btn{
    flex:1;

    min-width:0;

    min-height:35px;

    padding:0 4px;

    font-size:9px;
  }

  .f-view{
    min-height:55vh;
    min-height:55dvh;

    max-height:650px;
  }

  .f-head{
    min-height:39px;

    font-size:9px;
  }

  .f-body{
    padding:7px;
  }

  .f-tools{
    grid-template-columns:
      repeat(3,minmax(0,1fr));
  }

  .f-tool{
    min-height:37px;

    font-size:9px;
  }

}

/* SMALL PHONES */

@media(max-width:390px){

  .f-view{
    min-height:52vh;
    min-height:52dvh;
  }

  .f-tools{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

}

</style>
</head>

<body>

<main id="forge3d">

<div class="f-app">

<header class="lf-header">

  <div class="lf-logo">
    LF
  </div>

  <div class="lf-brand">

    <div class="lf-name">
      LocalForge 3D
    </div>

    <div class="lf-sub">

    </div>

  </div>

  <div class="lf-engine">

  <button

    data-work="object"

  <button
    class="f-tab"
    type="button"

    Edit
  </button>

    class="f-tab"
    type="button"

    class="f-tab"

  </button>

  </button>

</nav>


<div class="f-layout">


<!-- LEFT PANEL -->

<section class="f-panel f-left">

  <div class="f-head">

    <span id="f-left-title">

  </div>

  <div
    class="f-body"

  >

    <div class="f-label">

    </div>

    <div class="f-tools">

      <button
        class="f-tool"

      >
        Box
      </button>

      <button
        class="f-tool"
        disabled
      >
        Sphere
      </button>

      <button
        class="f-tool"
        disabled
      >
        Cylinder
      </button>

      <button
        class="f-tool"
        disabled
      >
        Torus
      </button>

    </div>

    <div class="f-divider"></div>

    <div class="f-help">
      Initializing modeling tools…
    </div>

  </div>

</section>


<!-- VIEWPORT -->

<section class="f-stage">

  <div class="f-stagebar">

    <button
      class="f-btn active"
      data-gizmo="translate"
      type="button"
    >
      Move
    </button>

    <button
      class="f-btn"
      data-gizmo="rotate"
      type="button"
    >
      Rotate
    </button>

    <button
      class="f-btn"
      data-gizmo="scale"
      type="button"
    >
      Scale
    </button>

    <button
      class="f-btn"
      id="f-space"

      World

  <div

    <div

  <div
    class="f-status"
    id="f-status"

</section>


<!-- RIGHT PANEL -->

<section class="f-panel f-right">

  <div class="f-head">

    <span id="f-right-title">
      Properties
    </span>

  </div>

  <div
    class="f-body"
    id="f-right"
  >

    <div class="f-label">
      Engine
    </div>

    <div class="f-help">
      Waiting for LocalForge engine…
    </div>

  </div>

</section>


</div>

</div>

</main>


<!-- =====================================================
     LOAD EXISTING APP
     Cache-busting query is intentional for GitHub Pages.
     ===================================================== -->

<script
  type="module"
  src="./assets/js/app.js?v=20260825-1"
></script>


<script>
(() => {

  const view =
    document.getElementById("f-view");

  const status =
    document.getElementById("f-status");

  const engineText =
    document.getElementById("lf-engine-text");


  function ready(){

    const canvas =
      view.querySelector("canvas");

    if(!canvas)
      return false;


    view.classList.add(
      "has-canvas"
    );

    document.body.classList.add(
      "engine-ready"
    );


    if(engineText)
      engineText.textContent =
        "Ready";


    return true;

  }


  const observer =
    new MutationObserver(() => {

      if(ready())
        observer.disconnect();

    });


  observer.observe(
    view,
    {
      childList:true,
      subtree:true
    }
  );


  ready();


  setTimeout(() => {

    if(
      !view.querySelector("canvas")
    ){

      if(engineText)
        engineText.textContent =
          "Load failed";


      if(status)
        status.textContent =
          "app.js did not start — check assets/js/app.js.";

    }

  },10000);


  window.addEventListener(
    "error",
    event => {

      console.error(
        "LocalForge:",
        event.error ||
        event.message
      );

    }
  );


  window.addEventListener(
    "unhandledrejection",
    event => {

      console.error(
        "LocalForge module:",
        event.reason
      );

    }
  );


  /*
   * Register PWA only after everything else.
   * A broken/stale service worker should not block boot.
   */

  if(
    "serviceWorker" in navigator
  ){

    window.addEventListener(
      "load",
      () => {

        navigator
          .serviceWorker
          .register(
            "./sw.js"
          )
          .catch(
            console.warn
          );

      }
    );

  }

})();
</script>
